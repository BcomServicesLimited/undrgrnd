<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dance, Pole &amp; Yoga Classes Gold Coast | UNDRGRND Movement Studio</title>
  <meta name="description" content="Gold Coast dance, pole fitness, yoga &amp; aerial classes at UNDRGRND Movement — beginner-friendly programs for every body, serving Surfers Paradise &amp; surrounding areas. Get started today.">
  <link rel="canonical" href="https://www.undrgrnd.com.au/">

  <link rel="stylesheet" href="/fonts/roboto.css">

  <link rel="stylesheet" href="/css/global.css">
  <script src="/js/schema-generator.js"></script>

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.undrgrnd.com.au/">
  <meta property="og:title" content="Dance, Pole &amp; Yoga Classes Gold Coast | UNDRGRND Movement">
  <meta property="og:description" content="Gold Coast dance, pole fitness, yoga, aerial &amp; recovery classes for adults and kids at UNDRGRND Movement.">
  <meta property="og:image" content="https://www.undrgrnd.com.au/images/og-image.jpg">

  <link rel="stylesheet" href="/css/theme-v2.css">
</head>
<body class="v2 has-strip">

  <div id="site-nav"></div>

  <!-- ===================== FULL-SCREEN HERO SLIDER ===================== -->
  <header class="v2-hero">
    <div class="v2-slides" id="heroSlides">
      <div class="v2-slide is-active" style="background-image:url('/images/hero/hero-aerial.webp')"></div>
      <div class="v2-slide" style="background-image:url('/images/hero/pole-male.webp')"></div>
      <div class="v2-slide mslide-ap" style="background-image:url('/images/hero/hero-aerial-pole.webp')"></div>
      <div class="v2-slide" style="background-image:url('/images/hero/hero-flow.webp')"></div>
      <div class="v2-slide" style="background-image:url('/images/hero/hero-yoga.webp');background-position:center 55%;"></div>
    </div>
    <div class="v2-hero__scrim"></div>
    <div class="v2-hero__inner">
      <span class="v2-eyebrow">Gold Coast Movement Space</span>
      <p class="v2-hero__term" data-booking-term></p>
    </div>
    <div class="v2-dots" id="heroDots"></div>
  </header>

  <!-- ===================== LIGHT → GREY FLOW ===================== -->
  <div class="v2-flow">

    <!-- Intro strip -->
    <section class="v2-intro">
      <div class="v2-intro__inner">
        <h2 class="v2-intro__title">Integrated Movement Arts</h2>
        <div class="v2-intro__body">
          <p>is UNDRGRND's approach to movement education, where children develop physical literacy by exploring multiple movement disciplines as one connected practice.</p>
        </div>
      </div>
    </section>

    <div style="height:6rem"></div>
  </div>

  <!-- ===================== INSTAGRAM ===================== -->
  <section class="v2-insta-min">
    <a class="v2-insta-min__link" href="https://instagram.com/undrgrnd_goldcoast" target="_blank" rel="noopener" aria-label="Follow us on Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
    </a>
  </section>

  <div id="site-footer"></div>

  <script src="/js/layout.js"></script>
  <script src="/js/booking-controller.js?v=4"></script>
  <script>
    /* Hero slider: crossfade + dots */
    (function () {
      var slides = Array.prototype.slice.call(document.querySelectorAll('.v2-slide'));
      var dotsWrap = document.getElementById('heroDots');
      if (slides.length < 2) return;
      var i = 0, timer;
      slides.forEach(function (s, idx) {
        var b = document.createElement('button');
        b.setAttribute('aria-label', 'Slide ' + (idx + 1));
        if (idx === 0) b.className = 'is-active';
        b.addEventListener('click', function () { go(idx); reset(); });
        dotsWrap.appendChild(b);
      });
      var dots = Array.prototype.slice.call(dotsWrap.children);
      function go(n) {
        slides[i].classList.remove('is-active'); dots[i].classList.remove('is-active');
        i = (n + slides.length) % slides.length;
        slides[i].classList.add('is-active'); dots[i].classList.add('is-active');
      }
      function reset() { clearInterval(timer); timer = setInterval(function () { go(i + 1); }, 3500); }
      reset();
    })();

  </script>
</body>
</html>
