<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact / Enquire | UNDRGRND Movement Gold Coast</title>
  <meta name="description" content="Enquire about classes at UNDRGRND Movement — Gold Coast movement programs for kids. Send us a message and we'll be in touch, or call 0721 402 690.">
  <link rel="canonical" href="https://www.undrgrnd.com.au/contact">
  <link rel="stylesheet" href="/fonts/roboto.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/theme-v2.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "ContactPage",
        "@id": "https://www.undrgrnd.com.au/contact#page",
        "url": "https://www.undrgrnd.com.au/contact",
        "name": "Contact / Enquire — UNDRGRND Movement",
        "about": { "@id": "https://www.undrgrnd.com.au/#business" }
      },
      {
        "@type": "LocalBusiness",
        "@id": "https://www.undrgrnd.com.au/#business",
        "name": "UNDRGRND Movement",
        "url": "https://www.undrgrnd.com.au/",
        "telephone": "+61721402690",
        "areaServed": { "@type": "City", "name": "Gold Coast" },
        "address": { "@type": "PostalAddress", "addressLocality": "Gold Coast", "addressRegion": "QLD", "addressCountry": "AU" }
      }
    ]
  }
  </script>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.undrgrnd.com.au/contact">
  <meta property="og:title" content="Contact / Enquire | UNDRGRND Movement">
  <meta property="og:description" content="Enquire about classes at UNDRGRND Movement on the Gold Coast.">
  <meta property="og:image" content="https://www.undrgrnd.com.au/images/og-image.jpg">
  <style>
    .enq-wrap { background: var(--v2-grey-top); padding: 8rem 6% 5rem; }
    .enq-head { max-width: 640px; margin: 0 auto 2.5rem; text-align: center; }
    .enq-head h1 { font-size: clamp(2.2rem,5vw,3.4rem); font-weight: 400; letter-spacing: 0.02em; text-transform: uppercase; color: var(--v2-text); margin: 0.6rem 0 1rem; }
    .enq-head .lead { color: var(--v2-muted); font-weight: 300; font-size: 1.1rem; line-height: 1.7; }
    .enq-head .lead a { color: var(--v2-accent-solid); text-decoration: none; font-weight: 500; }
    .enq-form { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 8px; padding: clamp(1.5rem,4vw,2.5rem); box-shadow: 0 18px 50px rgba(0,0,0,0.06); }
    .enq-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.25rem; }
    @media (max-width: 600px) { .enq-form .form-row { grid-template-columns: 1fr; } }
    .enq-form .form-label { color: var(--v2-text); font-weight: 600; font-size: 0.92rem; }
    .enq-form .req { color: var(--v2-accent-solid); }
    .enq-submit { width: 100%; margin-top: 0.5rem; border: none; cursor: pointer; font-size: 0.95rem; }
    .enq-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .enq-status { text-align: center; margin-top: 1rem; min-height: 1.2em; font-weight: 600; line-height: 1.5; }
    .enq-status.is-success { color: #15803d; }
    .enq-status.is-error { color: #b91c1c; }
    .enq-hp { position: absolute !important; left: -9999px !important; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  </style>
</head>
<body class="v2">

  <div id="site-nav"></div>

  <main class="enq-wrap">
    <div class="enq-head">
      <span class="v2-label" style="justify-content:center;">Enquire</span>
      <!-- H1 temporarily removed for redesign; reactivate later: <h1>Get in Touch</h1> -->
      <p class="lead">Have a question or want to enrol your child? Send us a message and we'll be in touch shortly. Prefer to talk? Call <a href="tel:+61721402690">0721 402 690</a> — calls are answered by our friendly AI receptionist, available anytime, who'll help or pass your message straight to the team.</p>
    </div>

    <form id="enquiryForm" class="enq-form" action="https://api.web3forms.com/submit" method="POST" novalidate>
      <!-- ▼ Web3Forms — replace with your real access key ▼ -->
      <input type="hidden" name="access_key" value="REPLACE_WITH_WEB3FORMS_ACCESS_KEY">
      <input type="hidden" name="subject" value="New Enquiry — UNDRGRND Movement">
      <input type="hidden" name="from_name" value="UNDRGRND Movement Website">
      <input type="checkbox" name="botcheck" class="enq-hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="name">Full name <span class="req">*</span></label>
          <input class="form-input" type="text" id="name" name="Name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone <span class="req">*</span></label>
          <input class="form-input" type="tel" id="phone" name="Phone" required autocomplete="tel" inputmode="tel" placeholder="e.g. 0400 000 000">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email <span class="req">*</span></label>
        <input class="form-input" type="email" id="email" name="Email" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="program">Program of interest <span class="req">*</span></label>
        <select class="form-select" id="program" name="Program of Interest" required>
          <option value="" disabled selected>Choose a program</option>
          <option>Junior Academy (6–10)</option>
          <option>Tween Exploration (11–14)</option>
          <option>Teen Elite Lab (14–17)</option>
          <option>Not sure yet — help me choose</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="message">Your message <span class="req">*</span></label>
        <textarea class="form-textarea" id="message" name="Message" required placeholder="Tell us a little about what you're looking for — your child's age, any experience, preferred days/times…"></textarea>
      </div>

      <button type="submit" class="cta-button enq-submit" id="enqSubmit">Send Enquiry</button>
      <p class="enq-status" id="enqStatus" role="status" aria-live="polite"></p>
    </form>
  </main>

  <div id="site-footer"></div>

  <script src="/js/layout.js"></script>
  <script>
    (function () {
      var form = document.getElementById('enquiryForm');
      if (!form) return;
      var statusEl = document.getElementById('enqStatus');
      var btn = document.getElementById('enqSubmit');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        statusEl.className = 'enq-status'; statusEl.textContent = '';
        if (!form.checkValidity()) { form.reportValidity(); return; }
        btn.disabled = true; var original = btn.textContent; btn.textContent = 'Sending…';
        fetch('https://api.web3forms.com/submit', { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } })
          .then(function (r) { return r.json(); })
          .then(function (json) {
            if (json.success) {
              form.reset();
              statusEl.textContent = 'Thanks! Your enquiry has been sent — we\'ll be in touch shortly.';
              statusEl.classList.add('is-success');
            } else {
              statusEl.textContent = (json.message || 'Something went wrong.') + ' Please call us on 0721 402 690.';
              statusEl.classList.add('is-error');
            }
          })
          .catch(function () {
            statusEl.textContent = 'Network error — please call us on 0721 402 690.';
            statusEl.classList.add('is-error');
          })
          .finally(function () { btn.disabled = false; btn.textContent = original; });
      });
    })();
  </script>
</body>
</html>
